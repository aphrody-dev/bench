[package]
name = "stack-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
